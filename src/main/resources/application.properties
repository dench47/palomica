# ========== SERVER ==========
server.port=${SERVER_PORT:8085}

# ========== MySQL ==========
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== Beget S3 ==========
beget.s3.endpoint=${S3_ENDPOINT}
beget.s3.access-key=${S3_ACCESS_KEY}
beget.s3.secret-key=${S3_SECRET_KEY}
beget.s3.bucket-name=${S3_BUCKET_NAME}
beget.s3.region=${S3_REGION}
beget.s3.path-style-url=${S3_PATH_STYLE_URL}

# ========== Email Beget ==========
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# ========== Telegram ==========
telegram.bot.token=${TELEGRAM_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.admin-chat-ids=${TELEGRAM_ADMIN_CHAT_IDS}

# ========== Яндекс API ==========
yandex.geocoder.api-key=${YANDEX_GEOCODER_API_KEY}

# ========== Яндекс Доставка API ==========
yandex.delivery.api.url=${YANDEX_DELIVERY_API_URL}
yandex.delivery.api.token=${YANDEX_DELIVERY_PROD_TOKEN}
yandex.delivery.widget.station-id=${YANDEX_DELIVERY_PROD_STATION_ID}

# ========== Настройки загрузки ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
spring.web.resources.cache.period=31536000
spring.web.resources.chain.cache=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ========== JWT ==========
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.security.enabled=true

logging.level.com.example.fashionstorebackend.service.S3Service=INFO
logging.level.com.example.fashionstorebackend.controller.ProductController=INFO

app.email.from=${EMAIL_FROM}
app.email.from-name=${EMAIL_FROM_NAME}

# ========== URL frontend ==========
app.frontend-url=${APP_FRONTEND_URL}
app.base-url=${APP_BASE_URL}

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
